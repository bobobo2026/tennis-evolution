[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tennis-evolution"
version = "0.2.0"
description = "Turn a long tennis recording into label-burned highlight reels: highlight list -> keyframe-accurate lossless cuts -> sync-correct reel -> corner labels -> self check."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tennis-evolution contributors" }]
keywords = ["ffmpeg", "tennis", "highlight", "video-editing", "hdr", "hevc", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tennis-evolution = "tennis_evolution.cli:main"

[project.urls]
Homepage = "https://github.com/bobobo2026/tennis-evolution"
Issues = "https://github.com/bobobo2026/tennis-evolution/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_evolution"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires ffmpeg/ffprobe on PATH"]
